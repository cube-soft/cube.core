version: 9.5.0.{build}
environment:
    PROJECT_NAME:  'Cube.Core'
    TEST_COVERAGE: 'Coverage.xml'
    TEST_RESULTS:  'TestResults'
clone_folder: 'C:\Cube\%PROJECT_NAME%'
image: Visual Studio 2022
platform: Any CPU
configuration: Release
skip_tags: true
branches:
    only:
        - master
        - test_coverlet
nuget:
    project_feed: true
    disable_publish_on_pr: true
before_build:
    - nuget restore "%PROJECT_NAME%.sln"
build:
    project: '%PROJECT_NAME%.sln'
    parallel: true
    publish_nuget: true
    verbosity: minimal
test_script:
    - >
      dotnet test
      --no-restore
      --no-build
      -c Release
      --settings coverlet.runsettings
      --results-directory "%TEST_RESULTS%"
      --collect:"XPlat Code Coverage"
      --logger:Appveyor
      %PROJECT_NAME%.sln


#      "%TEST_TOOL%"
#      -log:Error
#      -register:appveyor
#      -target:dotnet.exe
#      -targetargs:"test --no-restore --no-build --logger:Appveyor %PROJECT_NAME%.sln"
#      -returntargetcode
#      -hideskipped:All
#      -mergeoutput
#      -output:"%TEST_COVERAGE%"
#      -filter:"%TEST_FILTERS%"
after_test:
    - choco install codecov
    - codecov -f "%TEST_COVERAGE%"
    - xcopy /q /Y /I "%TEST_COVERAGE%" "%TEST_RESULTS%\"
    - cmd: for /f "delims=" %%x in ('dir /b /s *.log') do xcopy /q /Y /I "%%x" "%TEST_RESULTS%\"
artifacts:
    - path: '%TEST_RESULTS%'
